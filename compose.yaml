services:
  backend:
    build: ./backend
    ports:
      - "${BACKEND_HOST_PORT:-5001}:5000"
    volumes:
      - task-manager-data:/data
    environment:
      DATABASE_PATH: /data/tasks.db
    networks:
      - task-manager-network
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_HOST_PORT:-5174}:5173"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:5001/api/tasks}
    networks:
      - task-manager-network
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  task-manager-data:
    external: true

networks:
  task-manager-network:
    external: true

